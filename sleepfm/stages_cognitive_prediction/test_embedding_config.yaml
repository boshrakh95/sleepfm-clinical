# Test config for embedding generation
task:
  task_type: 'classification'
  target: 'sustained_attention'
  use_demographics: true

model:
  name: 'CognitivePredictionModel'
  pretrained_model: 'base'
  pretrained_checkpoint: '/home/boshra95/sleepfm-clinical/sleepfm/checkpoints/model_base/best.pt'
  params:
    embed_dim: 128
    num_heads: 4
    num_layers: 2
    pooling_head: 4
    dropout: 0.1
    max_seq_length: null

data:
  data_path: '/home/boshra95/scratch/stages/sleepfm_format/hdf5_data'
  labels_path: '/home/boshra95/scratch/stages/sleepfm_format/labels/labels_with_demographics.csv'
  quality_path: '/home/boshra95/scratch/stages/sleepfm_format/quality_metadata'
  split_path: '/home/boshra95/sleepfm-clinical/sleepfm/configs/dataset_split.json'
  channel_groups_path: '/home/boshra95/sleepfm-clinical/sleepfm/configs/channel_groups.json'
  modality_types: ["BAS", "RESP", "EKG", "EMG"]
  max_channels:
    BAS: 10
    RESP: 7
    EKG: 2
    EMG: 4
  sampling_freq: 128
  sampling_duration: 5
  patch_size: 640
  max_files: 5  # Process only 5 subjects for quick testing

preprocessing:
  embeddings_dir: '/home/boshra95/scratch/stages/sleepfm_format/test_embeddings'
  generate_embeddings: true
  save_granular_embeddings: false  # Only save aggregated (5-min) embeddings
  exclude_channels: []  # List of channel names to exclude, e.g., ['AIRFLOW', 'FLOW']

system:
  seed: 42
  device: 'cpu'
  num_workers: 1
  batch_size: 2
  pin_memory: false
  prefetch_factor: 2

# Training configuration
training:
  epochs: 2  # Just 2 epochs for testing
  batch_size: 2
  optimizer: 'AdamW'
  lr: 0.0001
  weight_decay: 0.01
  loss_function: 'CrossEntropy'  # For classification
  accumulation_steps: 1
  max_grad_norm: 1.0
  use_amp: false  # No mixed precision on CPU
  scheduler: null  # No scheduler for testing
  early_stopping:
    enabled: false
    patience: 5

# Evaluation configuration
evaluation:
  eval_interval: 1  # Evaluate every epoch
  metrics: ['Accuracy', 'F1', 'AUC']  # For classification
  primary_metric: 'Accuracy'
  higher_is_better: true
  save_predictions: true

# Logging configuration
logging:
  output_dir: '/home/boshra95/scratch/stages/sleepfm_format/test_models'
  experiment_name: 'test_cognitive'
  log_interval: 1
  use_wandb: false
  use_tensorboard: false
  save_checkpoint_interval: 1
  save_best_only: true
  keep_top_k: 1
