# ============================================================================
# STAGES Cognitive Prediction Fine-tuning Configuration
# ============================================================================
# This config file controls all aspects of fine-tuning SleepFM for cognitive
# prediction tasks on the STAGES dataset.

# ============================================================================
# TASK CONFIGURATION
# ============================================================================
task:
  # Task type: 'regression' or 'classification'
  # - 'regression': Predict continuous z-scores
  # - 'classification': Predict binary labels (0/1)
  # The model (CognitiveEmbeddingLSTM) automatically adapts to your choice
  task_type: 'classification' 
  
  # Cognitive target to predict
  # Options: sustained_attention, working_memory, episodic_memory, 
  #          executive_functioning, CPF_A.CPF_CR, CPF_A.CPF_FP, CPF_A.CPF_TPRT
  target: 'sustained_attention'
  
  # Include age and gender as additional features
  # The model automatically adapts: includes demographics embedding if true, skips if false
  # NO need to change model name when toggling this
  use_demographics: true
  
  # Quality filtering
  use_quality_filtering: true  # Use quality metadata to filter/weight embeddings
  min_clean_ratio: 0.5  # Minimum ratio of clean segments (0.0-1.0)
  quality_weighting: false  # Weight embeddings by quality (experimental)

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  # Model architecture: CognitivePredictionModel
  # Based on DiagnosisFinetuneFullLSTMCOXPHWithDemo structure
  # Automatically adapts based on:
  #   - task.task_type ('regression' or 'classification')
  #   - task.use_demographics (true or false)
  name: 'CognitivePredictionModel'
  
  # Pre-trained model to load
  # Options: 'base' or 'diagnosis'
  pretrained_model: 'base'  # Use base SetTransformer or diagnosis model
  
  # Path to pre-trained checkpoint
  # For base model (SetTransformer):
  pretrained_checkpoint: '/home/boshra95/sleepfm-clinical/sleepfm/checkpoints/model_base/best.pt'
  
  # For diagnosis model (if using diagnosis as pretrained):
  # pretrained_checkpoint: '/home/boshra95/sleepfm-clinical/sleepfm/checkpoints/model_diagnosis/best.pth'
  
  # Model parameters
  params:
    embed_dim: 128  # From checkpoint
    num_heads: 4  # For task model (not pretrained SetTransformer)
    num_layers: 2  # LSTM layers
    pooling_head: 4  # For spatial pooling across modalities
    dropout: 0.1  # Task model dropout
    max_seq_length: null  # null = unlimited, or set to max number of 5-min chunks expected

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  # Base directory containing HDF5 files
  data_path: '/home/boshra95/scratch/stages/sleepfm_format/hdf5_data'
  
  # Labels directory
  labels_path: '/home/boshra95/scratch/stages/sleepfm_format/labels'
  
  # Quality metadata directory
  quality_path: '/home/boshra95/scratch/stages/sleepfm_format/quality_metadata'
  
  # Split file (will be constructed as dataset_split_{target}.json)
  split_path: '/home/boshra95/scratch/stages/sleepfm_format/splits/dataset_split_sustained_attention.json'
  
  # Channel groups configuration
  channel_groups_path: '/home/boshra95/sleepfm-clinical/sleepfm/configs/channel_groups.json'
  
  # Modalities to use (must match pretrained model)
  modality_types: ["BAS", "RESP", "EKG", "EMG"]
  
  # Maximum channels per modality (from pretrained model checkpoint)
  # These values MUST match the pretrained model's training configuration
  max_channels:
    BAS: 10   # From checkpoint config: BAS_CHANNELS
    RESP: 7   # From checkpoint config: RESP_CHANNELS
    EKG: 2    # From checkpoint config: EKG_CHANNELS
    EMG: 4    # From checkpoint config: EMG_CHANNELS
  
  # Sampling parameters (from pretrained model checkpoint)
  sampling_freq: 128  # Hz (from checkpoint)
  sampling_duration: 5  # minutes (5-minute windows for embedding generation)
  patch_size: 640  # 5 seconds * 128 Hz (from checkpoint - for model internal processing)
  
  # Data loading
  max_files: null  # null = use all files, or specify number for debugging
  cache_embeddings: true  # Cache embeddings to disk for faster training

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Training parameters
  batch_size: 4
  epochs: 50
  
  # Optimizer
  optimizer: 'AdamW'
  lr: 0.0001
  weight_decay: 0.01
  
  # Learning rate scheduler
  scheduler: 'CosineAnnealingLR'  # or 'ReduceLROnPlateau', 'StepLR'
  scheduler_params:
    T_max: 50  # for CosineAnnealingLR
    eta_min: 0.000001
    # patience: 5  # for ReduceLROnPlateau
    # factor: 0.5
  
  # Gradient accumulation
  accumulation_steps: 4
  
  # Mixed precision training
  use_amp: true
  
  # Gradient clipping
  max_grad_norm: 1.0
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
  
  # Loss function
  # For regression: 'MSE', 'MAE', 'Huber', 'SmoothL1'
  # For classification: 'BCE', 'CrossEntropy', 'FocalLoss'
  loss_function: 'BCE'
  
  # For Huber loss
  huber_delta: 1.0
  
  # For Focal loss (classification)
  focal_alpha: 0.25
  focal_gamma: 2.0
  
  # Regularization
  l1_lambda: 0.0  # L1 regularization on output layer
  
  # Freeze encoder (only train LSTM and output layer)
  freeze_encoder: false
  freeze_epochs: 0  # Freeze encoder for first N epochs

# ============================================================================
# VALIDATION & EVALUATION
# ============================================================================
evaluation:
  # Validation frequency
  eval_interval: 1  # Evaluate every N epochs
  
  # Metrics to compute
  # For regression: 'MSE', 'MAE', 'R2', 'PearsonR', 'SpearmanR'
  # For classification: 'Accuracy', 'F1', 'AUC', 'Precision', 'Recall'
  metrics:
    - 'Accuracy'
    - 'F1'
    - 'AUC'
    - 'Precision'
    - 'Recall'
  
  # Primary metric for model selection
  primary_metric: 'Accuracy'
  higher_is_better: true  # true for R2, F1, AUC; false for MSE, MAE
  
  # Save predictions
  save_predictions: true
  save_attention_weights: false  # Save attention weights for interpretation

# ============================================================================
# LOGGING & SAVING
# ============================================================================
logging:
  # Output directory
  output_dir: '/home/boshra95/scratch/stages/sleepfm_format/cognitive_models'
  
  # Experiment name (will add timestamp)
  experiment_name: 'stages_cognitive'
  
  # Logging frequency
  log_interval: 10  # Log every N batches
  
  # Weights & Biases
  use_wandb: false
  wandb_project: 'stages_cognitive_prediction'
  wandb_entity: null  # Your W&B username/team
  
  # TensorBoard
  use_tensorboard: false
  
  # Save checkpoints
  save_checkpoint_interval: 5  # Save every N epochs
  save_best_only: false  # Also save checkpoints at regular intervals
  
  # Keep top K checkpoints
  keep_top_k: 3

# ============================================================================
# SYSTEM CONFIGURATION
# ============================================================================
system:
  # Random seed for reproducibility
  seed: 42
  
  # Device
  device: 'cuda'  # 'cuda' or 'cpu'
  
  # DataLoader
  num_workers: 4  # For embedding generation
  batch_size: 16  # For embedding generation
  pin_memory: true
  prefetch_factor: 2
  
  # Distributed training (if using multiple GPUs)
  distributed: false
  world_size: 1
  local_rank: 0

# ============================================================================
# PREPROCESSING (for embeddings)
# ============================================================================
preprocessing:
  # Directory containing pre-computed embeddings (from generate_embeddings.py)
  embeddings_dir: '/home/boshra95/scratch/stages/sleepfm_format/embeddings'
  
  # IMPORTANT: Set to FALSE to use pre-computed cached embeddings (RECOMMENDED)
  # Set to TRUE for on-the-fly embedding generation (NOT YET IMPLEMENTED)
  # You should run generate_embeddings.py first, then set this to false
  generate_embeddings: false  # false = use cached embeddings (RECOMMENDED)
  
  # Save granular (5-second level) embeddings in addition to aggregated (5-minute level)
  # Default: false (only save aggregated embeddings which are used for downstream tasks)
  # Set to true if you want both aggregated and granular embeddings
  save_granular_embeddings: false
  
  # Channel exclusion: List of channel names to exclude from analysis
  # Example: ['AIRFLOW', 'FLOW', 'Airflow', 'NEW AIR', 'NEWAIR', 'New Air']
  # Empty list means no channels are excluded
  exclude_channels: ["FLOW"]
  
  # Embedding aggregation method
  # Options: 'mean', 'max', 'attention', 'lstm'
  aggregation_method: 'mean'
  
  # Standardization
  standardize_embeddings: false  # Usually not needed if using pretrained features
  
  # Sleep stage filtering (optional)
  # Filter embeddings to specific sleep stages
  use_sleep_stage_filter: false
  sleep_stages: ['Stage1', 'Stage2', 'Stage3', 'REM']  # Empty = use all stages
  sleep_stages_path: null  # Path to sleep stage annotations

# ============================================================================
# ADVANCED OPTIONS
# ============================================================================
advanced:
  # Curriculum learning
  curriculum_learning: false
  curriculum_schedule: 'linear'  # 'linear', 'exponential'
  
  # Data augmentation
  augmentation:
    enabled: false
    mixup_alpha: 0.2
    cutmix_alpha: 0.0
    
  # Multi-task learning (predict multiple cognitive scores)
  multi_task: false
  auxiliary_targets: []  # ['working_memory', 'episodic_memory']
  auxiliary_loss_weight: 0.3
  
  # Ensemble
  ensemble: false
  num_ensemble_models: 5
  
  # Interpretability
  compute_gradcam: false
  compute_shap: false
